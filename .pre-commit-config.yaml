# =============================================================================
# Hero Skills Plugin - Pre-commit Configuration
# =============================================================================
# Tech stack: Markdown (SKILL.md files), Shell scripts, JSON, YAML
# =============================================================================
# Note: HERO.md is no longer auto-updated by a pre-commit hook (too slow).
# Skills detect when HERO.md is stale and recommend running
# `hero-skills:init-hero --update` to refresh it.
# =============================================================================

# Everything below runs on commit unless a hook overrides `stages` itself.
# Without this, a hook with no `stages` runs at EVERY installed stage — so the
# whole suite would also fire on push, doubling every commit's cost.
default_stages: [pre-commit]

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  # ===========================================================================
  # General safety checks
  # ===========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      # main is protected server-side too; this catches the mistake before the
      # push round-trip, and before a rejected push leaves a stranded commit.
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  # ===========================================================================
  # Secret detection
  # ===========================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # A committed baseline is what makes this hook actionable: without it
        # every pre-existing match re-reports on every run, and the noise
        # trains people to skip the hook. With it, only NEW findings surface.
        args: [--baseline, .secrets.baseline, --exclude-files, '.*\.lock$']

  # ===========================================================================
  # Markdown linting
  # ===========================================================================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.44.0
    hooks:
      - id: markdownlint
        args:
          - --fix
          - --disable=MD013  # line length — impractical for skill docs
          - --disable=MD024  # duplicate headings — skills reuse step headers
          - --disable=MD033  # inline HTML — needed for comments in HERO.md
          - --disable=MD036  # emphasis as heading
          - --disable=MD040  # fenced code block language — not all blocks need it
          - --disable=MD041  # first line heading — frontmatter comes first

  # ===========================================================================
  # Typo detection
  # ===========================================================================
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args: [--skip, '*.lock']

  # ===========================================================================
  # Shell script linting
  # ===========================================================================
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: \.sh$

  # ===========================================================================
  # Commit message convention (conventional commits)
  # ===========================================================================
  # ===========================================================================
  # Copyright headers
  # ===========================================================================
  # The header file is deliberately NOT the repo's LICENSE: insert-license's
  # own default (LICENSE.txt) would sit in the namespace GitHub scans to detect
  # the repo license. This repo ships shell and Markdown, so only the shell
  # scripts get stamped — Markdown carries no comment syntax the hook can use.
  #
  # --use-current-year: a frozen wrong year is worse than an annual diff. The
  # bump is one sweep each January:
  #   pre-commit run insert-license --all-files
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: copyright header (shell)
        files: \.sh$
        args:
          - --license-filepath=.license-header.txt
          - --comment-style=#
          - --use-current-year

  # ===========================================================================
  # Pre-push: security scanning
  # ===========================================================================
  # Pre-push, not pre-commit: it is the slowest hook here, and a push is the
  # last point where catching a finding is still cheap.
  - repo: https://github.com/semgrep/semgrep
    rev: v1.156.0
    hooks:
      - id: semgrep
        stages: [pre-push]
        args:
          - --config=auto
          - --error

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # ===========================================================================
  # Local hooks (hero-skills specific)
  # ===========================================================================
  - repo: local
    hooks:
      - id: validate-plugin
        name: Validate hero-skills plugin
        entry: ./scripts/validate.sh
        language: script
        pass_filenames: false
        always_run: true

      # Only fires when the library or its tests change — the suites are fast,
      # but there is no reason to run them on a docs-only commit.
      # Glob, don't enumerate. Naming each suite meant a newly added
      # scripts/*.test.sh ran nowhere — it matched neither the entry nor the
      # trigger below — so the suite silently guaranteed nothing.
      - id: shell-unit-tests
        name: "Shell library unit tests"
        entry: bash -c 'for t in scripts/*.test.sh; do echo "-- $t"; bash "$t" || exit 1; done'
        language: system
        pass_filenames: false
        # docs/AGENTS-MD.md is the spec check-agents-md.test.sh reads its R5/R6
        # lists from, so an edit there must re-run the suite.
        files: ^(scripts/.*\.sh|docs/AGENTS-MD\.md)$

      - id: agents-md
        name: "AGENTS.md meets docs/AGENTS-MD.md"
        entry: ./scripts/check-agents-md.sh
        language: script
        pass_filenames: false
        files: ^(AGENTS\.md|CLAUDE\.md|\.claude/rules/.*\.md|scripts/check-agents-md\.sh)$

      - id: agents-md-commit-msg
        name: "Commit message: no banned phrases"
        entry: ./scripts/check-agents-md.sh --commit-msg
        language: script
        stages: [commit-msg]

      - id: audit
        name: "Audit: check plugin quality"
        entry: ./scripts/hero-meta-precommit.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        verbose: true
