# The generic compliance CHECKS — the checklist items that test the controls
# in CONTROLS.yaml. The checker for each id lives in scripts/audit.py (or the
# fleet's own checkers.py) and is authoritative; `detect:` is a human
# description of it, never executed. The one `detect:` value the engine reads
# is `method: manual`, which declares that no checker exists on purpose — any
# other id without a checker fails to load, so a typo cannot report MANUAL
# forever.
#
# What is deliberately NOT here: `reference:` (which repo in a fleet is
# correct today), `known_violations` (a fleet's snapshot of who was broken
# when the check was written), and the incident `why:` history. Those are
# one fleet's facts and live in its register overlay, merged over this file
# by id. A fleet may also add checks, and may narrow a check with
# `applies_to: [GROUP, ...]` naming its FLEET.md groups.
#
# LAYERS are a taxonomy — the engine runs checks in control order:
#   structure — does the file exist? (no reading)
#   placement — is it in the right place, under the right name? (no reading)
#   content   — is what's inside it right?

version: 1

checks:

- id: CI-01
  control: C-SUPPLY
  scope: ci
  title: Third-party actions are pinned to a full commit SHA
  layer: content
  severity: high
  applies_to: all
  rule: >
    Every third-party action is pinned to a 40-character commit SHA with the
    version in a trailing comment. No mutable tags. ONE exception: a
    first-party reusable WORKFLOW under the fleet's own org may reference
    `main` — the callee's protected default branch — or a v-prefixed release
    tag. Any other branch is never acceptable, and a plain first-party action
    is not covered: the carve-out is for the fleet's distribution mechanism,
    not for the org.
  why: >
    A repointed tag silently changes what runs in a workflow that holds
    registry and deploy credentials. The carve-out is the price of a shared
    auto-approve workflow being shared at all — pinning its SHA turns every
    fix into one follow-up PR per consumer — and it is safe only because the
    callee gates its default branch on review.
  detect:
    method: script
    description: every `uses:` in .github/workflows/ carries a 40-hex SHA, except a first-party reusable workflow under the plugin's org (`ai-hero/`, the owner of the shared auto-approve workflow) at `@main` or a v-tag

- id: CI-02
  control: C-SUPPLY
  scope: ci
  title: Dependabot covers every ecosystem the repo uses
  layer: structure
  severity: medium
  applies_to: all
  rule: >
    .github/dependabot.yml exists and covers github-actions plus every
    package ecosystem present (gomod, npm, docker).
  why: >
    SHA pinning without dependabot is how a repo silently stops receiving
    security updates.
  detect:
    method: file_exists
    path: .github/dependabot.yml

- id: CI-04
  control: C-APPROVAL
  scope: ci
  title: The auto-approve workflow fails CLOSED
  layer: content
  severity: high
  applies_to: all
  rule: >
    The API response is checked for HTTP status before parsing; a missing,
    empty, or error response must NOT approve. The verdict is parsed from an
    anchored marker, not a bare grep for REQUEST_CHANGES anywhere in the text.
  why: >
    A fallback error string that does not match the verdict grep sends the
    else branch to APPROVE, so a missing API key, a 5xx, or a rate limit
    silently approves the PR. A thin caller into a shared workflow reports
    MANUAL here, not PASS: it holds no API call, so the property cannot be
    read from it.
  detect:
    method: script
    description: the checker reads the workflow for the fail-open string; a thin caller returns MANUAL

- id: STRUCT-04
  control: C-SECRETS
  scope: repo
  title: detect-secrets has a baseline
  layer: structure
  severity: medium
  applies_to: all
  rule: >
    A repo running the detect-secrets hook has a committed .secrets.baseline.
  why: >
    Without a baseline every finding must be silenced with an exclude
    pattern, which is indistinguishable from never having looked.
  detect:
    method: file_exists
    path: .secrets.baseline
    only_if: .pre-commit-config.yaml references detect-secrets

- id: STRUCT-07
  control: C-AGENT
  scope: repo
  title: Hero skills are initialised and the one-shot flow works end to end
  layer: structure
  severity: medium
  applies_to: all
  rule: >
    Every repo has a HERO.md generated by hero-skills:init-hero, and the
    end-to-end one-shot flow runs against it.
  why: >
    HERO.md is consistent precisely because it is generated rather than
    hand-copied. The gap is that nothing verifies the flow it feeds still
    works end to end; a config that no longer drives its tool is a gate
    that reads as present and does nothing.
  detect:
    method: manual
