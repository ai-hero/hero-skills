name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./.git/*" | while read f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate YAML files
        run: |
          python3 -c "
          import sys, yaml
          from pathlib import Path
          # rglob, not glob.glob: glob drops any path component starting with a
          # dot, so the old form skipped .github/workflows/ and
          # .pre-commit-config.yaml entirely — it validated ONE file repo-wide
          # and printed OK. A malformed workflow merged green and surfaced only
          # as GitHub's 'Invalid workflow file' annotation, on main, after the
          # fact. (glob's include_hidden= would also work, but is 3.11+.)
          files = [str(p) for p in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml'))]
          files = [f for f in files if not f.startswith('.git/')]
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(files)} YAML file(s) — OK')
          "

      - name: Validate skills plugin structure
        run: bash scripts/validate.sh

      # These 129 cases exist because each one was, or could again be, wrong
      # SILENTLY. Until now they ran nowhere — not in CI, not in pre-commit —
      # so the guarantee they encode was only as good as someone remembering
      # to run them by hand.
      - name: Shell library unit tests
        run: |
          # Glob rather than enumerate: a newly added scripts/*.test.sh
          # otherwise runs nowhere, which is the failure this step's own
          # comment describes.
          for t in scripts/*.test.sh; do
            echo "-- $t"
            bash "$t"
          done
