name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./.git/*" | while read f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate YAML files
        run: |
          python3 -c "
          import sys, glob, yaml
          files = glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True)
          files = [f for f in files if not f.startswith('.git/')]
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(files)} YAML file(s) — OK')
          "

      - name: Validate skills plugin structure
        run: bash scripts/validate.sh

      # These 129 cases exist because each one was, or could again be, wrong
      # SILENTLY. Until now they ran nowhere — not in CI, not in pre-commit —
      # so the guarantee they encode was only as good as someone remembering
      # to run them by hand.
      - name: Shell library unit tests
        run: |
          bash scripts/hero-lib.test.sh
          bash scripts/resume-state.test.sh
