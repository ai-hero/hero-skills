name: PR Check

on:
  pull_request:
    branches: [main]

# Least-privilege floor. Without a top-level block, a job with no permissions:
# of its own inherits this repo's CONFIGURED default (Settings -> Actions ->
# Workflow permissions), not a platform constant — so a job added later gets
# more access than this file appears to grant.
permissions:
  contents: read

# Supersede in-flight runs: a PR that gets three pushes in a minute should
# validate the last one, not burn a runner on each. Safe to cancel because
# this workflow only validates — it publishes nothing.
concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    # Cap the run. Structure validation and the shell suites finish in well
    # under this; the ceiling just stops a wedged step from pinning a runner
    # for the six-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./.git/*" | while read f; do
            jq empty "$f" || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Validate YAML files
        run: |
          python3 -c "
          import sys, yaml
          from pathlib import Path
          # rglob, not glob.glob: glob drops any path component starting with a
          # dot, so the old form skipped .github/workflows/ and
          # .pre-commit-config.yaml entirely — it validated ONE file repo-wide
          # and printed OK. A malformed workflow merged green and surfaced only
          # as GitHub's 'Invalid workflow file' annotation, on main, after the
          # fact. (glob's include_hidden= would also work, but is 3.11+.)
          files = [str(p) for p in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml'))]
          files = [f for f in files if not f.startswith('.git/')]
          errors = []
          for f in files:
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print(f'Validated {len(files)} YAML file(s) — OK')
          "

      - name: Validate skills plugin structure
        run: bash scripts/validate.sh

      # These 129 cases exist because each one was, or could again be, wrong
      # SILENTLY. Until now they ran nowhere — not in CI, not in pre-commit —
      # so the guarantee they encode was only as good as someone remembering
      # to run them by hand.
      - name: Shell library unit tests
        run: |
          # Glob rather than enumerate: a newly added scripts/*.test.sh
          # otherwise runs nowhere, which is the failure this step's own
          # comment describes.
          for t in scripts/*.test.sh; do
            echo "-- $t"
            bash "$t"
          done
