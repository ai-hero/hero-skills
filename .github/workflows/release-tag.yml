name: Move v1

# `v1` is what every caller resolves. Nothing else moves it: disable this job
# and callers keep running whatever commit the tag last pointed at, with no
# failing build anywhere to say so.
on:
  # Manual lever. Without it the only way to re-point the tag is to
  # manufacture a commit touching auto-approve.yml — which is the wrong thing
  # to be doing while a bad version is live in every consuming repo.
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to point v1 at (defaults to this ref's head)
        required: false
  push:
    branches: [main]
    paths:
      # Only the reusable workflow: it is the sole thing consumers resolve
      # through the tag. This assumes auto-approve.yml stays self-contained —
      # every step is an inline `run:` today. Give it a local
      # `uses: ./.github/actions/...` and a fix touching only that action
      # will not move v1, freezing the fleet mid-change.
      - .github/workflows/auto-approve.yml

permissions:
  contents: read

jobs:
  move-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    # Serialize. Two pushes in flight race their updates and force=true means
    # the LOSER wins: v1 lands on the older commit with both runs green.
    # Not cancel-in-progress — a cancelled run leaves the tag wherever the
    # survivor puts it, which is the same race with fewer witnesses.
    concurrency:
      group: move-v1
      cancel-in-progress: false
    steps:
      - name: Point v1 at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # -F, not -f: -f sends the string "true", which the refs API rejects.
          if ! ERR=$(gh api -X PATCH "/repos/$REPO/git/refs/tags/v1" \
                       -f sha="$TARGET_SHA" -F force=true 2>&1 >/dev/null); then
            # "Reference does not exist" is the ONLY failure that means
            # "create it". Retrying anything else as a create (403 from a tag
            # ruleset, a 5xx, a rate limit) fails with "Reference already
            # exists" — which says the tag is fine and you double-created it,
            # the exact opposite of the real cause.
            case "$ERR" in
              *"Reference does not exist"*)
                gh api -X POST "/repos/$REPO/git/refs" \
                  -f ref="refs/tags/v1" -f sha="$TARGET_SHA" >/dev/null
                ;;
              *)
                echo "::error::Could not move refs/tags/v1, and this is not a missing-tag error: $ERR"
                exit 1
                ;;
            esac
          fi

          # Read back. Without this the job prints a success it never checked,
          # which is how a lost race ends up green.
          ACTUAL=$(gh api "/repos/$REPO/git/refs/tags/v1" --jq '.object.sha')
          if [ "$ACTUAL" != "$TARGET_SHA" ]; then
            echo "::error::v1 is $ACTUAL, expected $TARGET_SHA — a concurrent run won the race."
            exit 1
          fi
          echo "v1 -> $TARGET_SHA"
